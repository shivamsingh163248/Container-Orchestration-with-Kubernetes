apiVersion: v1
kind: ServiceAccount
metadata:
  name: dashboard-operator
  namespace: mysql-project
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: dashboard-operator
  namespace: mysql-project
rules:
  - apiGroups: [""]
    resources:
      - configmaps
      - events
      - persistentvolumeclaims
      - pods
      - pods/log
      - secrets
      - services
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["apps"]
    resources:
      - deployments
      - replicasets
      - statefulsets
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: [""]
    resources:
      - limitranges
      - resourcequotas
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: dashboard-operator
  namespace: mysql-project
subjects:
  - kind: ServiceAccount
    name: dashboard-operator
    namespace: mysql-project
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: dashboard-operator
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: dashboard-namespace-discovery
rules:
  - apiGroups: [""]
    resources: ["namespaces"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: dashboard-namespace-discovery
subjects:
  - kind: ServiceAccount
    name: dashboard-operator
    namespace: mysql-project
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: dashboard-namespace-discovery